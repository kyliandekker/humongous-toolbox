
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Font Icon Demo</title>
</head>
<style>
	
@font-face {
	font-family: 'custom-font';
	src: url('./icon.ttf') format('truetype');
}

.icon {
	font-family: 'custom-font';
	font-size: 100px;
	margin: 10px;
}
.icon-cancel:before {
	content: "\e000";
}

.icon-folder:before {
	content: "\e001";
}

.icon-patch:before {
	content: "\e002";
}


</style>
<body>
	<h1>Icon Examples</h1>
		<div class="icon icon-cancel"></div>
		<div class="icon icon-folder"></div>
		<div class="icon icon-patch"></div>

</body>
</html>
